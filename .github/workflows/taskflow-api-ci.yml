# Generated by slipway for app `api` (runner=github-actions, pr_checks=always-run-gate). Regenerate with the scaffold; do not hand-edit.
# CI of ONE app. It runs when this app's inputs change (the `paths` below are rendered from .slipway/config.yaml and are the
# same list as the pathFilters in version.json). The stages live in _ci.yml. Deployment: taskflow-api-cd.yml.
name: taskflow-api-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "**"
      - "!.slipway/**"
      - "!**/*.md"
      - "!**/.terraform.lock.hcl"
  workflow_dispatch:

concurrency:
  group: taskflow-api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # the release job creates the tag api/v<version> on main
  id-token: write   # OIDC token for azure/login (no stored cloud credentials)
  pull-requests: read

jobs:
  changes:
    # Always runs on pull requests so the checks below can be required on main: when the PR does not touch
    # this app's inputs, `ci` is skipped, and a conditionally skipped job counts as passed for required status checks.
    # Job names carry the app name so the check names stay unique across apps (`api changes`, `api / test`).
    name: api changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          APP_PATHS: |
            **
            !.slipway
            !**/*.md
            !**/.terraform.lock.hcl
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename' > changed.txt
          python3 - <<'PY'
          import os,fnmatch
          paths=[p.strip().rstrip("/") for p in os.environ["APP_PATHS"].splitlines() if p.strip()]
          inc=[p for p in paths if not p.startswith("!")]; exc=[p[1:] for p in paths if p.startswith("!")]
          def m(f,p): return fnmatch.fnmatch(f,p) if "*" in p else (f==p or f.startswith(p+"/"))
          changed=[l.strip() for l in open("changed.txt") if l.strip()]
          hit=[f for f in changed if any(m(f,p) for p in inc) and not any(m(f,p) for p in exc)]
          with open(os.environ["GITHUB_OUTPUT"],"a") as out: out.write(f"run={'true' if hit else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as s:
              s.write(f"### api: {'changed' if hit else 'untouched'} by this pull request ({len(changed)} changed files, {len(hit)} among this app's inputs)\n")
              for f in hit[:20]: s.write(f"- `{f}`\n")
          PY

  test:
    # This app's tests, with its own service containers, before the shared stages build the image.
    name: api test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: "taskflow"
          POSTGRES_PASSWORD: "taskflow"
          POSTGRES_DB: "taskflow_test"
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: "postgres://taskflow:taskflow@localhost:5432/taskflow_test"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./package-lock.json
      - name: install api dependencies
        run: npm ci --prefix "." --no-audit --no-fund
      - name: test api
        run: npm test

  ci:
    name: api
    needs: [changes, test]
    if: needs.changes.outputs.run == 'true'
    uses: ./.github/workflows/_ci.yml
    with:
      app: api
      app_path: .
      context: .
      dockerfile: Dockerfile
      image_repository: taskflow/api
      is_dotnet: false
      is_node: true
      tag_prefix: api/v
    secrets: inherit

  result:
    # Always produces a check named `api ci`, whether the app was built or skipped: reusable-workflow jobs emit
    # no nested checks when the caller job is skipped, so a branch rule must require this check (and `api changes`).
    name: api ci
    needs: [changes, test, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }} | ci: ${{ needs.ci.result }}"
          case "${{ needs.test.result }}" in failure|cancelled) echo "::error::api: tests ${{ needs.test.result }}"; exit 1;; esac
          case "${{ needs.ci.result }}" in
            success) echo "api: built and tested";;
            skipped) echo "api: untouched by this change, nothing to build";;
            *) echo "::error::api: CI ${{ needs.ci.result }}"; exit 1;;
          esac
